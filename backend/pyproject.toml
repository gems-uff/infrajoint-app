[project]
name = "infrajoint-api"
version = "0.1.0"
description = "API clínica do InfraJoint — FastAPI sobre Postgres com RLS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "pyjwt[crypto]>=2.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Só para assinar PUTs do R2 (S3-compatível). Escrever a cadeia SigV4 à mão é o
    # tipo de código que parece simples e falha em silêncio.
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "ASYNC",    # flake8-async
    "RUF",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
